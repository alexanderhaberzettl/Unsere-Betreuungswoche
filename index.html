<html lang="de">
<head>

<style>
/* Layout: one column — status first, people as chips, a Mo–Fr week grid with a coverage strip per day, details below. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5b6676;
  --line: #e1e6ec;
  --accent: #1d6a72;
  --accent-ink: #ffffff;
  --ok: #2e9a5a;
  --ok-soft: #e3f4ea;
  --gap: #d44a3c;
  --gap-soft: rgba(212, 74, 60, .12);
  --warn: #b97a0d;
  --warn-soft: #fbf0d9;
  --p0: #e0714f; --p1: #3a78d4; --p2: #8460cc; --p3: #229386; --p4: #d99a12; --p5: #c24f93;
  --on-p: #ffffff;
  --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 6px 24px rgba(20, 30, 45, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hour: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1a2129; --ink: #e8edf2; --muted: #9aa6b4; --line: #2b3540;
    --accent: #5cc2c9; --accent-ink: #0d1a1c;
    --ok: #4cc683; --ok-soft: rgba(76, 198, 131, .14);
    --gap: #ff7b6b; --gap-soft: rgba(255, 123, 107, .14);
    --warn: #f0b54a; --warn-soft: rgba(240, 181, 74, .14);
    --p0: #f08e6e; --p1: #6c9cf0; --p2: #a68ae6; --p3: #45bfae; --p4: #eab43e; --p5: #e07ab5;
    --on-p: #111820;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a2129; --ink: #e8edf2; --muted: #9aa6b4; --line: #2b3540;
  --accent: #5cc2c9; --accent-ink: #0d1a1c;
  --ok: #4cc683; --ok-soft: rgba(76, 198, 131, .14);
  --gap: #ff7b6b; --gap-soft: rgba(255, 123, 107, .14);
  --warn: #f0b54a; --warn-soft: rgba(240, 181, 74, .14);
  --p0: #f08e6e; --p1: #6c9cf0; --p2: #a68ae6; --p3: #45bfae; --p4: #eab43e; --p5: #e07ab5;
  --on-p: #111820;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.1; }
h2 { font-size: 18px; }
h3 { font-size: 20px; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hint { margin: 0; color: var(--muted); font-size: 13.5px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-direction: column; gap: 4px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topline .eyebrow { margin: 0; }
.topmain { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.lang { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 5px 11px; font-weight: 600; font-size: 13px; color: var(--muted); letter-spacing: .03em; }
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--gap); }
.btn.ghost { border-color: transparent; background: transparent; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; }
.banner .actions { gap: 6px; }

.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.gap { background: var(--gap-soft); color: var(--gap); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: stretch; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.chip.active { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.chip-main { display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 12px; border: 0; background: none; text-align: left; }
.dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; }
.chip.eltern .dot { background: repeating-linear-gradient(135deg, var(--c) 0 3px, color-mix(in srgb, var(--c) 45%, var(--surface)) 3px 6px); }
.chip-name { font-weight: 600; display: block; line-height: 1.2; }
.chip-sub { font-size: 12.5px; color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
.chip-sub .ok { color: var(--ok); font-weight: 600; }
.chip-sub .warn { color: var(--warn); font-weight: 600; }
.chip-edit { border: 0; background: none; padding: 0 10px; color: var(--muted); display: grid; place-items: center; }
.chip-edit:hover { color: var(--ink); }
.chip-add { border: 1.5px dashed var(--line); border-radius: 12px; background: transparent; padding: 8px 14px; font-weight: 600; color: var(--muted); }
.chip-add:hover { color: var(--ink); border-color: var(--muted); }

.calendar { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 12px 12px; }
.cal-scroll { overflow-x: auto; }
.cal { --lanes: 1; display: grid; grid-template-columns: 44px repeat(5, minmax(max(140px, calc(var(--lanes) * 52px + 16px)), 1fr)); column-gap: 6px; min-width: 0; }
@media (max-width: 700px) {
  .cal { grid-template-columns: 40px repeat(5, max(min(78vw, 300px), calc(var(--lanes) * 76px + 16px))); }
  .cal .times, .cal .corner { position: sticky; left: 0; z-index: 3; background: var(--surface); }
  .blk { font-size: 12.5px; }
  .cal-scroll { scroll-snap-type: x proximity; }
  .daybody { scroll-snap-align: start; scroll-margin-left: 46px; }
}
.dayhead { font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 0 4px 8px 12px; display: flex; align-items: center; gap: 8px; }
.dayhead .dd { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dayhead .dd.no { background: var(--gap); }
.times { position: relative; height: calc(11 * var(--hour)); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.times span { position: absolute; right: 6px; transform: translateY(-50%); }
.times span:first-child { transform: none; }
.times span:last-child { transform: translateY(-100%); }
.daybody { position: relative; height: calc(11 * var(--hour)); border-radius: 8px; background-color: color-mix(in srgb, var(--bg) 55%, var(--surface)); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour)); user-select: none; -webkit-user-select: none; cursor: crosshair; }
.gapband { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--gap-soft) 0 6px, transparent 6px 12px); border-top: 1px dashed var(--gap); border-bottom: 1px dashed var(--gap); pointer-events: none; }
.strip { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 8px 0 0 8px; overflow: hidden; }
.strip i { position: absolute; left: 0; right: 0; background: var(--ok); }
.strip i.no { background: var(--gap); }
.lanes { position: absolute; left: 10px; right: 3px; top: 0; bottom: 0; }
.lanebg { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--c) 9%, transparent); border-radius: 4px; pointer-events: none; }
.blk { position: absolute; border-radius: 6px; background: var(--c); color: var(--on-p); font-size: 11.5px; line-height: 1.25; padding: 3px 4px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 1px; border: 0; text-align: left; font-variant-numeric: tabular-nums; }
.blk.eltern { background: repeating-linear-gradient(135deg, var(--c) 0 7px, color-mix(in srgb, var(--c) 72%, var(--surface)) 7px 14px); }
.blk.eltern.ho { background: radial-gradient(circle, color-mix(in srgb, var(--c) 40%, var(--surface)) 0 1.8px, transparent 2.3px) 0 0 / 8px 8px, var(--c); }
.blk:hover { filter: brightness(1.06); box-shadow: 0 0 0 2px var(--ink); }
.blk .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .tm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .92; }
.blk .bp { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bp.bot { margin-top: auto; }
.blk .bp.miss { opacity: .75; font-style: italic; }
.hdl { position: absolute; left: 0; right: 0; height: 9px; cursor: ns-resize; touch-action: none; z-index: 1; }
.hdl.top { top: 0; } .hdl.bot { bottom: 0; }
.hdl::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 3px; margin: -1.5px 0 0 -11px; border-radius: 2px; background: var(--on-p); opacity: 0; transition: opacity .12s; }
.blk:hover .hdl::after, .blk.resizing .hdl::after { opacity: .85; }
@media (hover: none) { .hdl { height: 14px; } .hdl::after { opacity: .6; } }
.blk.resizing { box-shadow: 0 0 0 2px var(--ink); z-index: 2; }
body.is-resizing, body.is-resizing * { cursor: ns-resize !important; }
.blk.preview { opacity: .6; outline: 2px dashed var(--ink); pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; padding-left: 4px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.work { background: repeating-linear-gradient(135deg, var(--muted) 0 3px, transparent 3px 6px); border: 1px solid var(--muted); }
.sw.ho { background: radial-gradient(circle, var(--muted) 0 1.3px, transparent 1.7px) 0 0 / 5px 5px; border: 1px solid var(--muted); }
.sw.care { background: var(--muted); }
.check { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.sw.gap { background: repeating-linear-gradient(135deg, var(--gap-soft) 0 3px, transparent 3px 6px); border: 1px dashed var(--gap); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--surface); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin-bottom: 8px; }
.card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.card li { display: flex; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
.card li b { min-width: 28px; }
.card li .m { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.m.gap { background: var(--gap); } .m.warn { background: var(--warn); } .m.ok { background: var(--ok); }
.card .empty { color: var(--muted); margin: 0; }

dialog { border: 0; border-radius: 16px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
dialog::backdrop { background: rgba(15, 22, 30, .45); }
.dlg { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.dlg .sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 600; min-width: 0; }
.field input, .field select, .field textarea { font-weight: 400; font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); width: 100%; min-width: 0; }
.field textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px; font-weight: 500; font-size: 14px; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.colors { display: flex; gap: 8px; }
.colors label { position: relative; }
.colors input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.colors span { display: block; width: 28px; height: 28px; border-radius: 8px; background: var(--c); }
.colors input:checked + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.helptext { margin: 0; font-size: 13.5px; color: var(--muted); background: var(--bg); border-radius: 9px; padding: 9px 11px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding-top: 4px; }
.dlg-foot .spacer { flex: 1; }
.linkbox { display: flex; gap: 8px; }
.linkbox input { flex: 1; min-width: 0; font-size: 13px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
details summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
details[open] summary { margin-bottom: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); }
@media (max-width: 560px) {
  .actions .btn { flex: 1; }
  .actions { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .blk, .btn { transition: box-shadow .15s, border-color .15s, filter .15s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="topline">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" lang="de" title="Deutsch">DE</button>
        <button type="button" data-lang="en" lang="en" title="English">EN</button>

    <div class="topmain">

        <button type="button" class="btn primary" id="shareBtn" data-i18n="share"></button>
      </div>

  </header>

  <div class="banner" id="banner" hidden></div>
  <section class="status" id="status" aria-live="polite"></section>

  <section>
    <div class="sec-head">
      <h2 data-i18n="whoCares"></h2>
      <p class="hint" id="drawHint"></p>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="calendar">
    <div class="cal-scroll"><div class="cal" id="cal"></div></div>
    <div class="legend">
      <span><i class="sw work"></i><span data-i18n="lgWork"></span></span>
      <span><i class="sw ho"></i><span data-i18n="lgHo"></span></span>
      <span><i class="sw care"></i><span data-i18n="lgCare"></span></span>
      <span><i class="sw gap"></i><span data-i18n="lgGap"></span></span>
    </div>
  </section>

  <section class="summary" id="summary"></section>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>
<datalist id="names"></datalist>

<script>

  };
  function detectLang() {
    try { const s = localStorage.getItem(LANG_KEY); if (s === 'de' || s === 'en') return s; } catch {}
    const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    return String(langs[0] || 'en').toLowerCase().startsWith('de') ? 'de' : 'en';
  }
  let lang = detectLang();
  const t = (k, ...a) => { const v = L[lang][k]; return typeof v === 'function' ? v(...a) : v; };

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch {}
    if (dlg.open) dlg.close();
    applyStatic(); render();
  }

  let state, shared = null, active = null, drag = null, resize = null, suppressClick = false, lastPointer = 'mouse';

  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  const toInput = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const parseT = v => { const [h, mm] = (v || '0:0').split(':').map(Number); return h * 60 + (mm || 0); };
  const snap = m => Math.min(END, Math.max(START, Math.round(m / STEP) * STEP));
  const fmtH = x => x.toLocaleString(t('locale'), { maximumFractionDigits: 2 });
  const hourPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 48;
  const byName = n => state.people.find(p => p.name.trim().toLowerCase() === String(n || '').trim().toLowerCase());

  // ---------- Beispiel ----------
  function example() {
    const wk = (days, s, e, extra = {}) => days.map(d => ({ d, s, e, ...extra }));
    return {
      example: true,
      people: [
        { id: uid(), name: t('kitaName'), type: 'kita', color: 3, blocks: wk([0, 1, 2, 3, 4], 510, 720, { bring: '', pick: '' }) }
      ]
    };
  }

  // ---------- Speichern ----------
  function loadOwn() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
  function save() {
    if (shared) return;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  }
  function changed() {
    if (state.example) { state.example = false; }
    state.people.forEach(normalize);
    save(); render();
  }

  function normalize(p) {
    const bl = p.blocks
      .map(b => ({ ...b, s: snap(b.s), e: snap(b.e) }))
      .filter(b => b.e > b.s)
      .sort((a, b) => a.d - b.d || a.s - b.s);
    const out = [];
    for (const b of bl) {
      const last = out[out.length - 1];
      if (last && last.d === b.d && b.s <= last.e && !!last.ho === !!b.ho) {
        if (b.e > last.e) { last.e = b.e; if (p.type === 'kita') last.pick = b.pick || last.pick; }
      } else out.push({ ...b });
    }
    p.blocks = out;
  }

  // ---------- Berechnung ----------
  const overlaps = (b, d, s, e) => b.d === d && b.s < e && b.e > s;
  function coverage() {
    const n = (END - START) / STEP;
    return [0, 1, 2, 3, 4].map(d => {
      const arr = [];
      for (let i = 0; i < n; i++) {
        const t0 = START + i * STEP, t2 = t0 + STEP;
        arr.push(state.people.some(p => p.type === 'eltern'
          ? !p.blocks.some(b => overlaps(b, d, t0, t2))
          : p.blocks.some(b => overlaps(b, d, t0, t2))));
      }
      return arr;
    });
  }
  function runs(arr, val) {
    const out = []; let st = null;
    arr.forEach((v, i) => {
      if (v === val && st === null) st = i;
      if (v !== val && st !== null) { out.push([START + st * STEP, START + i * STEP]); st = null; }
    });
    if (st !== null) out.push([START + st * STEP, END]);
    return out;
  }
  function hoursOf(p) { return p.blocks.reduce((a, b) => a + (b.e - b.s), 0) / 60; }

  function checkPerson(name, d, tm, what) {
    const day = t('days')[d], time = fmt(tm), B = what === 'bring';
    if (!String(name || '').trim()) return t(B ? 'wBringMissing' : 'wPickMissing', day, time);
    const p = byName(name);
    if (!p) return null;
    if (p.type === 'eltern' && p.blocks.some(b => b.d === d && b.s < tm && b.e > tm))
      return t(B ? 'wBringWorks' : 'wPickWorks', day, time, p.name);
    if (p.type === 'betreuung' && !p.blocks.some(b => b.d === d && b.s <= tm && b.e >= tm))
      return t(B ? 'wBringAway' : 'wPickAway', day, time, p.name);
    return null;
  }
  function analyse() {
    const cov = coverage();
    const gaps = [];
    cov.forEach((arr, d) => runs(arr, false).forEach(([s, e]) => gaps.push({ d, s, e })));
    const warns = [];
    state.people.filter(p => p.type === 'kita').forEach(k => k.blocks.forEach(b => {
      const w1 = checkPerson(b.bring, b.d, b.s, 'bring'); if (w1) warns.push(w1);
      const w2 = checkPerson(b.pick, b.d, b.e, 'pick'); if (w2) warns.push(w2);
    }));
    const hours = state.people.filter(p => p.type === 'eltern' && p.hours > 0).map(p => ({ p, ist: hoursOf(p) }));
    return { cov, gaps, warns, hours };
  }

  // ---------- Darstellung ----------
  function render() {
    const a = analyse();
    renderBanner();
    renderStatus(a);
    renderChips();
    renderCal(a);
    renderSummary(a);
    $('#names').innerHTML = state.people.filter(p => p.type !== 'kita').map(p => `<option value="${esc(p.name)}">`).join('');
  }

  function renderBanner() {
    const el = $('#banner');
    if (shared) {
      el.hidden = false;
      el.innerHTML = `<p>${t('bannerShared')}</p>
        <div class="actions"><button type="button" class="btn primary" data-act="adopt">${t('adopt')}</button>
        <button type="button" class="btn" data-act="mine">${t('mine')}</button></div>`;
    } else if (state.example) {
      el.hidden = false;
      el.innerHTML = `<p>${t('bannerStart')}</p>
        <div class="actions"><button type="button" class="btn" data-act="clear">${t('clear')}</button></div>`;
    } else el.hidden = true;
  }

  function renderStatus(a) {
    const parts = [];
    if (!state.people.length) parts.push(`<span class="pill warn">${t('nobody')}</span>`);
    else if (!a.gaps.length) parts.push(`<span class="pill ok">${t('allCovered')}</span>`);
    else {
      const mins = a.gaps.reduce((s, g) => s + g.e - g.s, 0);
      parts.push(`<span class="pill gap">${t('gapsPill', a.gaps.length, fmtH(mins / 60))}</span>`);
    }
    if (a.warns.length) parts.push(`<span class="pill warn">${t('warnsPill', a.warns.length)}</span>`);
    const off = a.hours.filter(h => Math.abs(h.ist - h.p.hours) > .01);
    if (off.length) parts.push(`<span class="pill warn">${t('hoursOff', off.map(h => esc(h.p.name)).join(', '))}</span>`);
    $('#status').innerHTML = parts.join('');
  }

  const pencil = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  function renderChips() {
    const html = state.people.map(p => {
      let sub = t('types')[p.type];
      if (p.type === 'eltern') {
        const ist = hoursOf(p);
        if (p.hours > 0) {
          const ok = Math.abs(ist - p.hours) < .01;
          sub += ` · <span class="${ok ? 'ok' : 'warn'}">${fmtH(ist)} / ${fmtH(p.hours)} h</span>`;
        } else sub += ` · ${t('hWork', fmtH(ist))}`;
      }
      return `<div class="chip ${p.type} ${active === p.id ? 'active' : ''}" style="--c:var(--p${p.color})">
        <button type="button" class="chip-main" data-sel="${p.id}" aria-pressed="${active === p.id}">
          <span class="dot"></span><span><span class="chip-name">${esc(p.name)}</span><span class="chip-sub">${sub}</span></span>
        </button>
        <button type="button" class="chip-edit" data-edit="${p.id}" aria-label="${esc(t('editP', p.name))}">${pencil}</button>
      </div>`;
    }).join('');
    $('#chips').innerHTML = html + `<button type="button" class="chip-add" id="addPerson">${t('addPerson')}</button>`;
    const ap = state.people.find(p => p.id === active);
    $('#drawHint').textContent = ap
      ? t(ap.type === 'eltern' ? 'hintEltern' : ap.type === 'kita' ? 'hintKita' : 'hintCare', ap.name)
      : t('hintDefault');
  }

  function renderCal(a) {
    const H = hourPx(), px = m => (m - START) / 60 * H;
    const n = Math.max(1, state.people.length);
    const DAYL = t('daysL');
    $('#cal').style.setProperty('--lanes', n);
    let h = `<div class="corner"></div>` + DAYL.map((name, d) => {
      const bad = a.gaps.some(g => g.d === d);
      return `<div class="dayhead"><span class="dd ${bad ? 'no' : ''}" title="${bad ? t('gapT') : t('coveredT')}"></span>${name}</div>`;
    }).join('');
    let times = '';
    for (let hr = 7; hr <= 18; hr++) times += `<span style="top:${(hr - 7) * H}px">${hr}:00</span>`;
    h += `<div class="times">${times}</div>`;
    [0, 1, 2, 3, 4].forEach(d => {
      let body = '';
      a.gaps.filter(g => g.d === d).forEach(g => body += `<div class="gapband" style="top:${px(g.s)}px;height:${px(g.e) - px(g.s)}px"></div>`);
      body += `<div class="strip">` + runs(a.cov[d], true).map(([s, e]) => `<i style="top:${px(s)}px;height:${px(e) - px(s)}px"></i>`).join('')
        + runs(a.cov[d], false).map(([s, e]) => `<i class="no" style="top:${px(s)}px;height:${px(e) - px(s)}px"></i>`).join('') + `</div>`;
      let lanes = '';
      state.people.forEach((p, li) => {
        const pos = `left:calc(${li} * 100% / ${n});width:calc(100% / ${n} - 3px)`;
        if (p.id === active) lanes += `<div class="lanebg" style="--c:var(--p${p.color});${pos}"></div>`;
        p.blocks.forEach((b, i) => {
          if (b.d !== d) return;
          const hgt = px(b.e) - px(b.s);
          const time = `${fmt(b.s)}–${fmt(b.e)}`;
          let inner;
          if (p.type === 'kita') {
            inner = `<span class="bp ${b.bring ? '' : 'miss'}">↓ ${esc(b.bring || t('whoBrings'))}</span>`
              + (hgt > 56 ? `<span class="tm">${time}</span>` : '')
              + `<span class="bp bot ${b.pick ? '' : 'miss'}">↑ ${esc(b.pick || t('whoPicks'))}</span>`;
          } else {
            inner = `<span class="nm">${esc(p.name)}${b.ho && hgt <= 34 ? ' · ' + t('hoShort') : ''}</span>` + (hgt > 34 ? `<span class="tm">${time}</span>` : '') + (b.ho && hgt > 50 ? `<span class="tm">${t('ho')}</span>` : '');
          }
          const label = `${p.name}, ${DAYL[d]} ${time}` + (p.type === 'eltern' ? (b.ho ? t('lblHo') : t('lblWork')) : '') + (p.type === 'kita' ? t('lblKita', b.bring, b.pick) : '');
          lanes += `<button type="button" class="blk ${p.type}${b.ho ? ' ho' : ''}" data-p="${p.id}" data-i="${i}" title="${esc(label)}" aria-label="${esc(label)}"
            style="--c:var(--p${p.color});${pos};top:${px(b.s)}px;height:${hgt}px">${inner}<span class="hdl top" title="${t('moveStart')}"></span><span class="hdl bot" title="${t('moveEnd')}"></span></button>`;
        });
      });
      body += `<div class="lanes">${lanes}</div>`;
      h += `<div class="daybody" data-d="${d}">${body}</div>`;
    });
    $('#cal').innerHTML = h;
  }

  function renderSummary(a) {
    const DAYS = t('days');
    const gaps = a.gaps.length
      ? `<ul>${a.gaps.map(g => `<li><span class="m gap"></span><b>${DAYS[g.d]}</b><span>${t('gapLine', fmt(g.s), fmt(g.e))}</span></li>`).join('')}</ul>`
      : `<p class="empty">${state.people.length ? t('noGaps') : t('addToSee')}</p>`;
    const warns = a.warns.length
      ? `<ul>${a.warns.map(w => `<li><span class="m warn"></span><span>${esc(w)}</span></li>`).join('')}</ul>`
      : `<p class="empty">${t('warnsOk')}</p>`;
    const hrs = a.hours.length
      ? `<ul>${a.hours.map(({ p, ist }) => {
          const ok = Math.abs(ist - p.hours) < .01;
          const ho = p.blocks.filter(b => b.ho).reduce((s, b) => s + b.e - b.s, 0) / 60;
          return `<li><span class="m ${ok ? 'ok' : 'warn'}"></span><span><b>${esc(p.name)}</b>: ${t('hoursLine', fmtH(ist), fmtH(p.hours))}${ho ? t('hoPart', fmtH(ho)) : ''}${ok ? '' : ist < p.hours ? t('missing', fmtH(p.hours - ist)) : t('tooMuch', fmtH(ist - p.hours))}</span></li>`;
        }).join('')}</ul>`
      : `<p class="empty">${t('hoursEmpty')}</p>`;
    $('#summary').innerHTML = `<div class="card"><h2>${t('cGaps')}</h2>${gaps}</div><div class="card"><h2>${t('cBP')}</h2>${warns}</div><div class="card"><h2>${t('cHours')}</h2>${hrs}</div>`;
  }

  // ---------- Dialoge ----------
  const dlg = $('#dlg'), body = $('#dlgBody');
  function openDlg(html, wire) {

    if (first) first.focus();
  }
  const close = () => dlg.close();
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });

  function twoStep(btn, label, fn) {
    btn.addEventListener('click', () => {
      if (btn.dataset.armed) return fn();
      btn.dataset.armed = '1'; btn.textContent = label;
    });
  }

  function personDlg(p) {
    const isNew = !p;
    p = p || { name: '', type: 'eltern', hours: 30, color: state.people.length % 6 };
    const help = { eltern: t('helpEltern'), betreuung: t('helpCare'), kita: t('helpKita') };
    openDlg(`
      <h3>${isNew ? t('dlgAddPerson') : esc(t('editP', p.name))}</h3>
      <label class="field">${t('name')}<input id="f-name" value="${esc(p.name)}" placeholder="${esc(t('namePh'))}" autocomplete="off"></label>
      <div class="field">${t('role')}<div class="seg">${Object.entries(t('types')).map(([k, v]) => `<label><input type="radio" name="f-type" value="${k}" ${p.type === k ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div></div>
      <p class="helptext" id="f-help"></p>
      <label class="field" id="f-hours-wrap">${t('hoursPerWeek')}<input id="f-hours" type="number" min="0" max="60" step="0.5" value="${p.hours || ''}" placeholder="${esc(t('hoursPh'))}"></label>
      <div class="field">${t('color')}<div class="colors">${[0, 1, 2, 3, 4, 5].map(c => `<label style="--c:var(--p${c})"><input type="radio" name="f-color" value="${c}" ${p.color === c ? 'checked' : ''} aria-label="${t('colorN', c + 1)}"><span></span></label>`).join('')}</div></div>
      <div class="dlg-foot">${isNew ? '' : `<button type="button" class="btn danger" id="f-del">${t('del')}</button>`}<span class="spacer"></span>
        <button type="button" class="btn" id="f-cancel">${t('cancel')}</button><button type="button" class="btn primary" id="f-save">${isNew ? t('add') : t('save')}</button></div>`,
      b => {
        const sync = () => {
          const ty = b.querySelector('[name=f-type]:checked').value;
          b.querySelector('#f-help').textContent = help[ty];
          b.querySelector('#f-hours-wrap').hidden = ty !== 'eltern';
        };
        b.querySelectorAll('[name=f-type]').forEach(r => r.addEventListener('change', sync)); sync();
        b.querySelector('#f-cancel').onclick = close;
        if (!isNew) twoStep(b.querySelector('#f-del'), t('reallyDel'), () => {
          state.people = state.people.filter(x => x.id !== p.id);
          if (active === p.id) active = null;
          close(); changed();
        });
        const doSave = () => {
          const name = b.querySelector('#f-name').value.trim();
          if (!name) { b.querySelector('#f-name').focus(); toast(t('needName')); return; }
          const type = b.querySelector('[name=f-type]:checked').value;
          const hours = parseFloat(b.querySelector('#f-hours').value) || 0;
          const color = +b.querySelector('[name=f-color]:checked').value;
          if (isNew) {
            const np = { id: uid(), name, type, hours: type === 'eltern' ? hours : 0, color, blocks: [] };
            state.people.push(np); active = np.id;
          } else {
            if (p.name !== name) state.people.forEach(k => k.type === 'kita' && k.blocks.forEach(bl => {
              if (bl.bring === p.name) bl.bring = name; if (bl.pick === p.name) bl.pick = name;
            }));
            Object.assign(p, { name, type, hours: type === 'eltern' ? hours : 0, color });
          }
          close(); changed();
          if (isNew) toast(t('added', name));
        };
        b.querySelector('#f-save').onclick = doSave;
        b.querySelector('#f-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSave(); } });
      });
  }

  const kitaFields = (b = {}) => `<div class="row" id="f-kita">
      <label class="field">${t('bringsName')}<input id="f-bring" list="names" value="${esc(b.bring || '')}" placeholder="${esc(t('bringPh'))}" autocomplete="off"></label>
      <label class="field">${t('picksName')}<input id="f-pick" list="names" value="${esc(b.pick || '')}" placeholder="${esc(t('pickPh'))}" autocomplete="off"></label></div>`;
  const timeFields = (s, e) => `<div class="row">
      <label class="field">${t('from')}<input id="f-s" type="time" min="07:00" max="18:00" step="900" value="${toInput(s)}"></label>
      <label class="field">${t('to')}<input id="f-e" type="time" min="07:00" max="18:00" step="900" value="${toInput(e)}"></label></div>`;
  const hoField = on => `<label class="check" id="f-howrap"><input type="checkbox" id="f-ho" ${on ? 'checked' : ''}>${t('ho')}</label>`;
  function readTimes(b) {
    const s = snap(parseT(b.querySelector('#f-s').value)), e = snap(parseT(b.querySelector('#f-e').value));
    if (e <= s) { toast(t('badTime')); return null; }
    return [s, e];
  }

  function addDlg(pre = {}) {
    if (!state.people.length) { personDlg(); return; }
    const pid = pre.pid || active || state.people[0].id;
    const days = pre.d != null ? [pre.d] : [0, 1, 2, 3, 4];
    const s = pre.s ?? 480, e = pre.e ?? Math.min(END, s + 240);
    openDlg(`
      <h3>${t('addTimes')}</h3>
      <label class="field">${t('forWhom')}<select id="f-p">${state.people.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)} (${t('types')[p.type]})</option>`).join('')}</select></label>
      <p class="helptext" id="f-help"></p>
      <div class="field">${t('whichDays')}<div class="seg">${t('days').map((d, i) => `<label><input type="checkbox" name="f-d" value="${i}" ${days.includes(i) ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div></div>
      ${timeFields(s, e)}
      ${hoField(false)}
      ${kitaFields()}
      <div class="dlg-foot"><span class="spacer"></span><button type="button" class="btn" id="f-cancel">${t('cancel')}</button><button type="button" class="btn primary" id="f-save">${t('enter')}</button></div>`,
      b => {
        const sync = () => {
          const p = state.people.find(x => x.id === b.querySelector('#f-p').value);
          b.querySelector('#f-kita').hidden = p.type !== 'kita';
          b.querySelector('#f-howrap').hidden = p.type !== 'eltern';
          b.querySelector('#f-help').textContent = t(p.type === 'eltern' ? 'addHelpEltern' : p.type === 'kita' ? 'addHelpKita' : 'addHelpCare', p.name);
        };
        b.querySelector('#f-p').onchange = sync; sync();
        b.querySelector('#f-cancel').onclick = close;
        b.querySelector('#f-save').onclick = () => {
          const p = state.people.find(x => x.id === b.querySelector('#f-p').value);
          const ds = [...b.querySelectorAll('[name=f-d]:checked')].map(x => +x.value);
          if (!ds.length) { toast(t('needDay')); return; }
          const tt = readTimes(b); if (!tt) return;
          const extra = p.type === 'kita' ? { bring: b.querySelector('#f-bring').value.trim(), pick: b.querySelector('#f-pick').value.trim() }
            : p.type === 'eltern' && b.querySelector('#f-ho').checked ? { ho: true } : {};
          if (p.type === 'kita') p.blocks = p.blocks.filter(x => !ds.includes(x.d) || !overlaps(x, x.d, tt[0], tt[1]));
          ds.forEach(d => p.blocks.push({ d, s: tt[0], e: tt[1], ...extra }));
          active = p.id;
          close(); changed();
        };
      });
  }

  function blockDlg(p, i) {
    const bl = p.blocks[i];
    openDlg(`
      <h3>${esc(p.name)}</h3>
      <p class="sub">${t('daysL')[bl.d]} · ${p.type === 'eltern' ? t('subWork') : p.type === 'kita' ? t('subKita') : t('subCare')}</p>
      ${timeFields(bl.s, bl.e)}
      ${p.type === 'eltern' ? hoField(bl.ho) : ''}
      ${p.type === 'kita' ? kitaFields(bl) : ''}
      <div class="dlg-foot"><button type="button" class="btn danger" id="f-del">${t('del')}</button><span class="spacer"></span>
        <button type="button" class="btn" id="f-cancel">${t('cancel')}</button><button type="button" class="btn primary" id="f-save">${t('save')}</button></div>`,
      b => {
        b.querySelector('#f-cancel').onclick = close;
        b.querySelector('#f-del').onclick = () => { p.blocks.splice(i, 1); close(); changed(); };
        b.querySelector('#f-save').onclick = () => {
          const tt = readTimes(b); if (!tt) return;
          Object.assign(bl, { s: tt[0], e: tt[1] });
          if (p.type === 'kita') { bl.bring = b.querySelector('#f-bring').value.trim(); bl.pick = b.querySelector('#f-pick').value.trim(); }
          if (p.type === 'eltern') { if (b.querySelector('#f-ho').checked) bl.ho = true; else delete bl.ho; }
          close(); changed();
        };
      });
  }

  // ---------- Teilen ----------
  const B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  function toB62(bytes) {
    let n = BigInt('0x01' + Array.from(bytes, x => x.toString(16).padStart(2, '0')).join(''));
    let s = '';
    while (n > 0n) { s = B62[Number(n % 62n)] + s; n /= 62n; }
    return s;
  }
  function fromB62(s) {
    let n = 0n;
    for (const ch of s) { const i = B62.indexOf(ch); if (i < 0) throw new Error('bad'); n = n * 62n + BigInt(i); }
    let h = n.toString(16); if (h.length % 2) h = '0' + h;
    const out = new Uint8Array(h.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i * 2, 2), 16);
    if (out[0] !== 1) throw new Error('bad');
    return out.slice(1);
  }
  async function streamBytes(bytes, T) {
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer());
  }
  function pack(st) {
    return st.people.map(p => [p.name, p.type[0], p.hours || 0, p.color,
      p.blocks.map(b => { const a = [b.d, (b.s - START) / STEP, (b.e - START) / STEP]; if (p.type === 'kita') a.push(b.bring || '', b.pick || ''); else if (b.ho) a.push(1); return a; })]);
  }
  function unpack(arr) {
    const T = { e: 'eltern', b: 'betreuung', k: 'kita' };
    return { people: arr.map(([name, ty, hours, color, bl]) => ({
      id: uid(), name: String(name), type: T[ty] || 'betreuung', hours: +hours || 0, color: (+color || 0) % 6,
      blocks: bl.map(([d, s, e, x, y]) => ({ d: +d, s: START + s * STEP, e: START + e * STEP,
        ...(T[ty] === 'kita' ? { bring: x || '', pick: y || '' } : {}), ...(T[ty] === 'eltern' && x ? { ho: true } : {}) }))
    })) };
  }
  async function encodePlan(st) {
    const raw = new TextEncoder().encode(JSON.stringify(pack(st)));
    if ('CompressionStream' in window) {
      try { return 'p1z' + toB62(await streamBytes(raw, CompressionStream)); } catch {}
    }
    return 'p1r' + toB62(raw);
  }
  async function decodePlan(code) {
    const m = /^p1([zr])([0-9A-Za-z]+)$/.exec(code.trim().replace(/^.*#/, ''));
    if (!m) throw new Error('bad');
    let bytes = fromB62(m[2]);
    if (m[1] === 'z') bytes = await streamBytes(bytes, DecompressionStream);
    const st = unpack(JSON.parse(new TextDecoder().decode(bytes)));
    st.people.forEach(normalize);
    return st;
  }
  function baseUrl() { return SHARE_BASE || location.href.split('#')[0]; }

  async function shareDlg() {
    const code = await encodePlan(state);
    const link = baseUrl() + '#' + code;
    openDlg(`
      <h3>${t('share')}</h3>
      <p class="sub">${t('shareSub')}</p>
      <div class="linkbox"><input id="f-link" readonly value="${esc(link)}" aria-label="${esc(t('linkAria'))}"><button type="button" class="btn primary" id="f-copy">${t('copy')}</button></div>
      <details><summary>${t('codeSummary')}</summary>
        <div class="field">${t('codeGive')}<div class="linkbox"><input id="f-code" readonly value="${esc(code)}"><button type="button" class="btn" id="f-copy2">${t('copy')}</button></div></div>
        <label class="field" style="margin-top:10px">${t('codePaste')}<textarea id="f-in" rows="3" placeholder="p1z…"></textarea></label>
        <div class="dlg-foot"><button type="button" class="btn" id="f-load">${t('openPlan')}</button></div>
      </details>
      <div class="dlg-foot"><button type="button" class="btn" id="f-cancel">${t('closeB')}</button></div>`,
      b => {
        const copy = (inp, btn) => {
          const ok = () => { btn.textContent = t('copied'); toast(t('copiedT')); };
          const fallback = () => { inp.focus(); inp.select(); toast(t('selectedT')); };
          try { navigator.clipboard.writeText(inp.value).then(ok, fallback); } catch { fallback(); }
        };
        b.querySelector('#f-copy').onclick = e => copy(b.querySelector('#f-link'), e.currentTarget);
        b.querySelector('#f-copy2').onclick = e => copy(b.querySelector('#f-code'), e.currentTarget);
        b.querySelector('#f-link').onfocus = e => e.target.select();
        b.querySelector('#f-cancel').onclick = close;
        b.querySelector('#f-load').onclick = async () => {
          try { openShared(await decodePlan(b.querySelector('#f-in').value)); close(); }
          catch { toast(t('badCode')); }
        };
      });
  }

  function openShared(st) {
    const own = loadOwn();
    if (!own || !own.people || !own.people.length || own.example) {
      state = st; shared = null; active = null; save(); render();
      clearHash(); toast(t('sharedLoaded'));
    } else {
      shared = true; state = st; active = null; render();
    }
  }
  function clearHash() { try { history.replaceState(null, '', location.href.split('#')[0]); } catch {} }

  // ---------- Ereignisse ----------
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#addBtn').onclick = () => addDlg();
  $('#shareBtn').onclick = () => shareDlg().catch(() => toast(t('linkFail')));
  $('#banner').addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'adopt') { shared = null; state.example = false; save(); clearHash(); render(); toast(t('adopted')); }
    if (act === 'mine') { shared = null; state = loadOwn() || example(); clearHash(); render(); }
    if (act === 'clear') { state = { people: [] }; active = null; save(); render(); personDlg(); }
  });
  $('#chips').addEventListener('click', e => {
    const sel = e.target.closest('[data-sel]'), ed = e.target.closest('[data-edit]');
    if (sel) { active = active === sel.dataset.sel ? null : sel.dataset.sel; render(); }
    else if (ed) personDlg(state.people.find(p => p.id === ed.dataset.edit));
    else if (e.target.closest('#addPerson')) personDlg();
  });

  const cal = $('#cal');
  const minuteAt = (bodyEl, y) => snap(START + (y - bodyEl.getBoundingClientRect().top) / hourPx() * 60);
  cal.addEventListener('pointerdown', e => {
    lastPointer = e.pointerType;
    const hd = e.target.closest('.hdl');
    if (hd && e.button === 0) {
      const blkEl = hd.closest('.blk'), p = state.people.find(x => x.id === blkEl.dataset.p), i = +blkEl.dataset.i;
      if (!p || !p.blocks[i]) return;
      e.preventDefault();
      resize = { p, i, edge: hd.classList.contains('top') ? 's' : 'e', bodyEl: blkEl.closest('.daybody'), blkEl, s: p.blocks[i].s, e: p.blocks[i].e, moved: false };
      blkEl.classList.add('resizing'); document.body.classList.add('is-resizing');
      try { blkEl.setPointerCapture(e.pointerId); } catch {}
      return;
    }
    if (e.pointerType === 'touch' || e.button !== 0) return;
    const bodyEl = e.target.closest('.daybody');
    if (!bodyEl || e.target.closest('.blk')) return;
    const p = state.people.find(x => x.id === active);
    if (!p) { addDlg({ d: +bodyEl.dataset.d, s: minuteAt(bodyEl, e.clientY) }); return; }
    e.preventDefault();
    const m0 = minuteAt(bodyEl, e.clientY);
    const lanes = bodyEl.querySelector('.lanes');
    const n = Math.max(1, state.people.length), li = state.people.indexOf(p);
    const pv = document.createElement('div');
    pv.className = 'blk preview ' + p.type;
    pv.style.cssText = `--c:var(--p${p.color});left:calc(${li} * 100% / ${n});width:calc(100% / ${n} - 3px)`;
    lanes.appendChild(pv);
    drag = { p, d: +bodyEl.dataset.d, bodyEl, m0, m1: m0, pv };
    try { bodyEl.setPointerCapture(e.pointerId); } catch {}
    updPreview();
  });
  function updPreview() {
    const H = hourPx(), s = Math.min(drag.m0, drag.m1), e = Math.max(drag.m0, drag.m1);
    drag.pv.style.top = (s - START) / 60 * H + 'px';
    drag.pv.style.height = Math.max(3, (e - s) / 60 * H) + 'px';
    drag.pv.innerHTML = e > s ? `<span class="tm">${fmt(s)}–${fmt(e)}</span>` : '';
  }
  cal.addEventListener('pointermove', e => {
    if (resize) {
      const r = resize, m = minuteAt(r.bodyEl, e.clientY);
      if (r.edge === 's') r.s = Math.min(m, r.e - STEP); else r.e = Math.max(m, r.s + STEP);
      const b = r.p.blocks[r.i];
      if (r.s === b.s && r.e === b.e && !r.moved) return;
      r.moved = true;
      const H = hourPx();
      r.blkEl.style.top = (r.s - START) / 60 * H + 'px';
      r.blkEl.style.height = (r.e - r.s) / 60 * H + 'px';
      const tm = r.blkEl.querySelector('.tm'); if (tm) tm.textContent = `${fmt(r.s)}–${fmt(r.e)}`;
      toast(`${r.p.name}: ${fmt(r.s)}–${fmt(r.e)}`);
      return;
    }
    if (!drag) return; drag.m1 = minuteAt(drag.bodyEl, e.clientY); updPreview();
  });
  const endDrag = e => {
    if (resize) {
      const r = resize; resize = null;
      r.blkEl.classList.remove('resizing'); document.body.classList.remove('is-resizing');
      if (!r.moved || e.type === 'pointercancel') { if (r.moved) render(); return; }
      suppressClick = true; setTimeout(() => suppressClick = false, 50);
      Object.assign(r.p.blocks[r.i], { s: r.s, e: r.e });
      changed();
      return;
    }
    if (!drag) return;
    if (e.type === 'pointerup') drag.m1 = minuteAt(drag.bodyEl, e.clientY);
    const { p, d, m0, m1, pv } = drag; drag = null; pv.remove();
    const s = Math.min(m0, m1), en = Math.max(m0, m1);
    if (e.type === 'pointercancel') return;
    if (en - s < STEP) { addDlg({ pid: p.id, d, s, e: Math.min(END, s + 60) }); return; }
    if (p.type === 'kita') p.blocks = p.blocks.filter(x => !overlaps(x, d, s, en));
    const nb = { d, s, e: en };
    if (p.type === 'kita') { const prev = p.blocks.find(x => x.bring || x.pick); nb.bring = prev?.bring || ''; nb.pick = prev?.pick || ''; }
    p.blocks.push(nb);
    changed();
    if (p.type === 'kita') { const i = p.blocks.findIndex(x => x.d === d && x.s <= s && x.e >= en); if (i >= 0) blockDlg(p, i); }
  };
  cal.addEventListener('pointerup', endDrag);
  cal.addEventListener('pointercancel', endDrag);
  cal.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    const blk = e.target.closest('.blk');
    if (blk && blk.dataset.p) { const p = state.people.find(x => x.id === blk.dataset.p); blockDlg(p, +blk.dataset.i); return; }
    const bodyEl = e.target.closest('.daybody');
    if (bodyEl && lastPointer === 'touch') addDlg({ pid: active, d: +bodyEl.dataset.d, s: minuteAt(bodyEl, e.clientY) });
  });

  let toastTimer;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2600);
  }

  // ---------- Start ----------
  applyStatic();
  state = loadOwn() || example();
  if (!state.people) state = example();
  render();
  const h = location.hash.slice(1);
  if (/^p1[zr]/.test(h)) decodePlan(h).then(openShared).catch(() => toast(t('brokenLink')));
})();
</script>

</html>
